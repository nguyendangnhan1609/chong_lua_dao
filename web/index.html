<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5fa5">
  <title>ChínhChủ – Bản demo</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="demo-banner" role="note">Bản demo, dữ liệu minh họa</div>
  <header class="topbar">
    <a class="brand" href="#/tra-cuu">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#0b5fa5"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ChínhChủ</span>
    </a>
    <nav class="roles" aria-label="Góc nhìn">
      <a href="#/tra-cuu" data-route="tra-cuu">Người dùng</a>
      <a href="#/doanh-nghiep" data-route="doanh-nghiep">Doanh nghiệp</a>
      <a href="#/quan-tri" data-route="quan-tri">Quản trị</a>
    </nav>
    <nav class="links" aria-label="Liên kết khác">
      <a href="#/mau" data-route="mau">Trang mẫu</a>
      <a href="#/gioi-thieu" data-route="gioi-thieu">Giới thiệu</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <noscript><p class="noscript">Cần bật JavaScript để xem bản demo.</p></noscript>
</body>
</html>
